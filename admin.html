<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SYLVA Admin Records</title>
  <link rel="stylesheet" href="style.css?v=20260719" />
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">SYLVA</a>
    <nav class="site-nav" aria-label="Primary navigation">
      <a href="index.html">Home</a>
      <a href="registrations.html">View registrations</a>
      <a href="admin.html">Admin</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div class="hero__content">
        <div>
          <p class="eyebrow">Private admin area</p>
          <h1>Registered customer records</h1>
          <p class="hero__description">This page is dedicated to you so you can review all registrations collected from the site.</p>
        </div>
      </div>
    </section>

    <section class="registration-dashboard-section">
      <div class="section-heading reveal">
        <p class="eyebrow">Saved records</p>
        <h2>All registrations</h2>
      </div>
      <div class="registration-list-wrapper reveal">
        <div class="registration-list" id="adminRecords" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <script>
    (async function () {
      const container = document.getElementById('adminRecords');
      if (!container) return;

      const getRegistrationApiBase = () => {
        const params = new URLSearchParams(window.location.search);
        const override = params.get('api') || window.SYLVA_REGISTRATION_API;
        if (override) return override.replace(/\/$/, '');
        return 'http://127.0.0.1:3000';
      };

      const registrationApiUrl = `${getRegistrationApiBase()}/registrations`;

      const renderEntries = (entries) => {
        if (!entries.length) {
          container.innerHTML = '<p class="empty-state">No registrations have been saved yet.</p>';
          return;
        }

        container.innerHTML = entries.map((entry, index) => `
          <article class="registration-entry">
            <h3>#${index + 1} — ${entry.name || 'Unknown'}</h3>
            <p><strong>Phone:</strong> ${entry.phone || '-'}</p>
            <p><strong>Email:</strong> ${entry.email || '-'}</p>
            <p><strong>Submitted:</strong> ${entry.time || 'Just now'}</p>
          </article>
        `).join('');
      };

      try {
        const stored = localStorage.getItem('sylvaRegistrations');
        const localEntries = stored ? JSON.parse(stored) : [];
        renderEntries(localEntries);

        const response = await fetch(registrationApiUrl);
        if (response.ok) {
          const payload = await response.json();
          if (Array.isArray(payload.entries)) {
            localStorage.setItem('sylvaRegistrations', JSON.stringify(payload.entries));
            renderEntries(payload.entries);
          }
        }
      } catch (error) {
        container.innerHTML = '<p class="empty-state">Unable to load records right now.</p>';
      }
    })();
  </script>
</body>
</html>
